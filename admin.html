<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员后台</title><link rel="stylesheet" href="style.css"></head><body><header><div><b>防盗门数据管理后台</b><small>上传 Excel 后云端立即更新</small></div><a href="index.html">返回查询</a></header><main><section id="loginCard" class="card admin"><h2>管理员登录</h2><label>邮箱<input id="email" type="email"></label><label>密码<input id="password" type="password"></label><button id="login">登录</button></section><section id="panel" class="hidden"><section class="card admin"><div class="row"><h2>上传《未入库.xlsx》</h2><button id="logout" class="secondary">退出登录</button></div><label>当前仓库<select id="warehouse"></select></label><p>系统自动读取 Sheet1，并将每行拆成“左”和“右”两条数据，计算：未入库数量 = 原数量 − 已入库数量。</p><input id="file" type="file" accept=".xlsx,.xls"><button id="upload">解析并覆盖当前仓库数据</button><div id="progress"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="supabase.js"></script><script src="admin.js"></script></body></html>
