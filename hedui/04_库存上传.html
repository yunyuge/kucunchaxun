<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>库存数据上传</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}
header{background:#111827;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:22px}.sub{font-size:12px;color:#cbd5e1;margin-top:5px}
header a{color:#bfdbfe;text-decoration:none;font-size:14px}main{max-width:760px;margin:28px auto;padding:0 16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:20px;margin-bottom:14px}h2{margin:0 0 16px;font-size:18px}.hidden{display:none}label{display:block;margin:12px 0;font-size:14px;font-weight:600}input{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid #d1d5db;border-radius:7px;font:inherit}button{padding:10px 14px;border:1px solid #2563eb;border-radius:7px;background:#2563eb;color:#fff;cursor:pointer;font-weight:600}button.secondary{background:#fff;color:#334155;border-color:#cbd5e1}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.hint{color:#64748b;font-size:13px;line-height:1.7}.warning{padding:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:7px;color:#9a3412;font-size:13px;line-height:1.6}#status{margin-top:14px;min-height:22px;color:#334155;font-size:14px;white-space:pre-wrap}
</style>
</head>
<body>
<header><div><h1>库存数据上传</h1><div class="sub">管理员登录后覆盖系统库存数据</div></div><a href="../index.html">返回主页面</a></header>
<main>
<section id="loginCard" class="card"><h2>管理员登录</h2><label>邮箱<input id="email" type="email" autocomplete="username"></label><label>密码<input id="password" type="password" autocomplete="current-password"></label><button id="login">登录</button><div id="loginStatus" class="hint"></div></section>
<section id="panel" class="card hidden"><div class="row"><h2>上传库存 Excel</h2><button id="logout" class="secondary">退出登录</button></div>
<p class="hint">第一张工作表的表头需包含：行号、商品全名、尺寸、开向、系列、库存数量。库存数量必须是大于等于 0 的整数。</p>
<div class="warning">上传会删除当前 inventory 表中的旧数据，并重置已盘点的实际数量。请确认 Excel 内容无误后再提交。</div>
<label>选择 Excel 文件<input id="file" type="file" accept=".xlsx,.xls"></label><button id="upload">解析并覆盖库存数据</button><div id="status"></div></section>
</main>
<script>
const SUPABASE_URL="https://bszucvsimgijzhuvzcnt.supabase.co";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_PUBLISHABLE_ANON_KEY";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
function setLoggedIn(value){$("loginCard").classList.toggle("hidden",value);$("panel").classList.toggle("hidden",!value)}
function status(text){$("status").textContent=text}
async function checkSession(){const {data}=await sb.auth.getSession();setLoggedIn(!!data.session)}
$("login").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value;if(!email||!password){$("loginStatus").textContent="请输入管理员邮箱和密码";return}$("loginStatus").textContent="正在登录...";const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){$("loginStatus").textContent="登录失败："+error.message;return}$("loginStatus").textContent="";setLoggedIn(!!data.session)}
$("logout").onclick=async()=>{await sb.auth.signOut();setLoggedIn(false)}
function text(value){return String(value??"").replace(/[\u0000-\u001f\u007f\ufeff\s]/g,"").trim()}
function headerKey(value){return text(value).replace(/[：:()（）]/g,"").toLowerCase()}
function parseRows(sheet){const matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:"",raw:true});if(!matrix.length)throw new Error("第一张工作表没有数据");const aliases={row_no:["行号","序号","row_no"],product_name:["商品全名","商品名称","产品名称","款式","product_name"],size:["尺寸","规格","size"],direction:["开向","方向","direction"],series:["系列","series"],system_stock:["库存数量","系统库存","数量","库存","system_stock"]};const headerIndex=matrix.findIndex(row=>{const keys=row.map(headerKey);return ["product_name","size","direction","system_stock"].filter(field=>aliases[field].some(alias=>keys.includes(headerKey(alias)))).length>=3});if(headerIndex<0)throw new Error("未找到表头，请确认表头包含：商品全名、尺寸、开向、系列、库存数量");const headers=matrix[headerIndex].map(headerKey);const columns={};Object.entries(aliases).forEach(([field,names])=>{columns[field]=headers.findIndex(header=>names.some(name=>header===headerKey(name)))});const out=[];matrix.slice(headerIndex+1).forEach((row,index)=>{const get=field=>columns[field]>=0?row[columns[field]]:"";const item={row_no:text(get("row_no")),product_name:text(get("product_name")),size:text(get("size")),direction:text(get("direction")),series:text(get("series")),system_stock:get("system_stock")};if(!item.product_name&&!item.size&&!item.direction&&(item.system_stock===""||item.system_stock===null))return;const excelRow=headerIndex+index+2;if(!item.product_name||!item.size||!item.direction)throw new Error(`第 ${excelRow} 行缺少商品全名、尺寸或开向`);if(item.system_stock===""||item.system_stock===null)throw new Error(`第 ${excelRow} 行缺少库存数量`);const stock=Number(item.system_stock);if(!Number.isInteger(stock)||stock<0)throw new Error(`第 ${excelRow} 行库存数量不是大于等于0的整数`);out.push({...item,system_stock:stock,actual_count:null,checked_at:null,checked_by:null,inventory_uploaded_at:new Date().toISOString(),updated_at:new Date().toISOString()})});if(!out.length)throw new Error("没有找到有效库存数据");return out}
$("upload").onclick=async()=>{const file=$("file").files[0];if(!file){alert("请选择 Excel 文件");return}const {data}=await sb.auth.getSession();if(!data.session){alert("登录状态已失效，请重新登录");setLoggedIn(false);return}try{status("正在读取 Excel...");const workbook=XLSX.read(await file.arrayBuffer(),{type:"array"});const rows=parseRows(workbook.Sheets[workbook.SheetNames[0]]);if(!confirm(`已解析 ${rows.length} 条数据。上传会覆盖现有库存并清空盘点数量，是否继续？`))return;status(`已解析 ${rows.length} 条，正在清理旧库存...`);const {error:deleteError}=await sb.from("inventory").delete().not("id","is",null);if(deleteError)throw deleteError;for(let i=0;i<rows.length;i+=200){status(`正在上传 ${Math.min(i+200,rows.length)}/${rows.length}...`);const {error}=await sb.from("inventory").insert(rows.slice(i,i+200));if(error)throw error}status(`上传完成，共更新 ${rows.length} 条库存数据。`);$("file").value=""}catch(error){console.error(error);status("上传失败："+error.message)}}
checkSession();
</script>
</body>
</html>
