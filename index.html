<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>防盗门预计出货查询</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><b>防盗门预计出货查询</b><small>根据最新未入库数据实时查询</small></div><a href="admin.html">管理员后台</a></header>
<main><section class="hero"><h1>查询预计出货时间</h1><p>请选择款式、尺寸、开向和左右</p></section>
<section class="card"><div class="grid">
<label>款式<select id="style"><option value="">请选择</option></select></label>
<label>尺寸<select id="size"><option value="">请选择</option></select></label>
<label>开向<select id="opening"><option value="">请选择</option></select></label>
<label>左右<select id="side"><option value="">请选择</option><option>左</option><option>右</option></select></label>
</div><button id="query">查询预计出货时间</button></section>
<section id="loading" class="hidden card center">正在读取最新云端数据...</section>
<section id="result" class="hidden card"></section><section id="empty" class="hidden card center">暂未找到可出货的对应产品，请检查查询条件。</section>
</main><footer>数据来自云端《未入库》批次数据 · 查询结果以最新上传数据为准</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="app.js"></script></body></html>
